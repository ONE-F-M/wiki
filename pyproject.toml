[project]
name = "wiki"
authors = [
    { name = "Frappe", email = "developers@frappe.io" }
]
description = "Simple Wiki App"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "ghdiff",
]

[project.optional-dependencies]
dev = [
    "basedmypy~=2.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"
profile = "black"

[tool.mypy]
strict = false
pretty = true
incremental = true
sqlite_cache = true
files = [
    "wiki/__init__.py",
    "wiki/hooks.py",
    "wiki/www/wiki.py",
    "wiki/wiki/doctype/wiki_page/wiki_page.py",
]
exclude = "^wiki/patches|/test_.*\\.py$"

[[tool.mypy.overrides]]
module = [
    "frappe.*",
    "erpnext.*",
]
ignore_missing_imports = true
