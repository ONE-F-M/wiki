[tool.bench.dev-dependencies]
basedmypy = "~=2.0.0"

[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"
profile = "black"

[tool.mypy]
strict = false
pretty = true
incremental = true
sqlite_cache = true
files = [
    "wiki/__init__.py",
    "wiki/hooks.py",
    "wiki/www/wiki.py",
    "wiki/wiki/doctype/wiki_page/wiki_page.py",
]
exclude = "^wiki/patches|/test_.*\\.py$"

[[tool.mypy.overrides]]
module = [
    "frappe.*",
    "erpnext.*",
]
ignore_missing_imports = true
