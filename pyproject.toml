[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"
profile = "black"

[tool.bench.dev-dependencies]
pytest-cov = "~=5.0.0"

[tool.pytest.ini_options]
addopts = "--cov=wiki --cov-report=term-missing --cov-fail-under=30"

[tool.coverage.run]
source = ["wiki"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/patches/*",
    "*/hooks.py",
    "*/config/*",
]

[tool.coverage.report]
fail_under = 30
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]
