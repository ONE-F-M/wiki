[tool.black]
line-length = 99

[tool.isort]
line_length = 99
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
indent = "\t"
profile = "black"

[project]
name = "wiki"
authors = [
    { name = "Frappe", email = "developers@frappe.io" }
]
description = "Simple Wiki App"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    "ghdiff",
]

[project.optional-dependencies]
dev = [
    "pytest-cov~=5.0.0",
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.pytest.ini_options]
addopts = "--cov=wiki --cov-report=term-missing --cov-fail-under=30"

[tool.coverage.run]
source = ["wiki"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/patches/*",
    "*/hooks.py",
    "*/config/*",
]

[tool.coverage.report]
fail_under = 30
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if typing.TYPE_CHECKING:",
]
