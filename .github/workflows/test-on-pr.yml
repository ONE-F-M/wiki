name: Tests

on:
  pull_request:
    branches: [staging, test-production, version-15]

concurrency:
  group: tests-wiki-${{ github.event_name }}-${{ github.event.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Server Tests with Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 60

    services:
      mariadb:
        image: mariadb:10.6
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: test_frappe
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -u root -proot"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3
      redis:
        image: redis:6-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=2s
          --health-retries=3

    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev libffi-dev liblcms2-dev libwebp-dev libpq-dev libmariadb-dev

      - name: Install bench and pytest-cov
        run: |
          pip install frappe-bench pytest-cov

      - name: Setup bench
        run: |
          bench init --skip-assets --python $(which python) --frappe-branch version-15 ~/frappe-bench
          cd ~/frappe-bench

      - name: Install dependencies
        run: |
          cd ~/frappe-bench
          bench setup requirements --dev

      - name: Get erpnext and hrms
        run: |
          cd ~/frappe-bench
          bench get-app erpnext --branch version-15
          bench get-app hrms --branch version-15

      - name: Install wiki app
        run: |
          cd ~/frappe-bench
          bench get-app wiki $GITHUB_WORKSPACE

      - name: Create site
        run: |
          cd ~/frappe-bench
          bench new-site test_site --mariadb-root-password root --admin-password admin

      - name: Install app on site
        run: |
          cd ~/frappe-bench
          bench --site test_site install-app wiki

      - name: Run tests with coverage
        run: |
          cd ~/frappe-bench
          source env/bin/activate
          coverage run --source apps/wiki/wiki -m frappe.commands.utils run-tests --app wiki --site test_site --failfast
          coverage report --fail-under=30
          coverage xml
        env:
          TYPE: server

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true
